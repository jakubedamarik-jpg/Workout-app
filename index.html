<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tréninky">
<title>Tréninky — posilovna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0e13; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.07);
    --border:rgba(255,255,255,.09); --border2:rgba(255,255,255,.16);
    --text:#eef0f6; --muted:#98a1b3;
    --accent:#f97316; --accent2:#fb923c; --grad:linear-gradient(135deg,#f97316,#ef4444);
    --danger:#f87171; --ok:#34d399; --radius:16px;
    --c-ramena:#f59e0b; --c-prsa:#ef4444; --c-zada:#3b82f6; --c-nohy:#22c55e;
    --c-biceps:#a855f7; --c-triceps:#ec4899; --c-bricho:#14b8a6; --c-predlokti:#eab308;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.45; min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  body::before{content:""; position:fixed; inset:0; z-index:-1; background:
    radial-gradient(700px 420px at 88% -12%, rgba(249,115,22,.17), transparent 60%),
    radial-gradient(800px 520px at -12% 112%, rgba(59,130,246,.13), transparent 60%),
    radial-gradient(500px 380px at 105% 65%, rgba(168,85,247,.08), transparent 60%),
    var(--bg);}
  .app{max-width:1140px; margin:0 auto; padding:0 16px 100px;
    padding-left:calc(16px + env(safe-area-inset-left, 0px));
    padding-right:calc(16px + env(safe-area-inset-right, 0px))}

  /* ---------- header ---------- */
  .topbar{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px;
    padding:14px 4px; padding-top:calc(14px + env(safe-area-inset-top, 0px)); margin:0 -4px 14px;
    background:rgba(12,14,19,.72); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(255,255,255,.06)}
  .logo{display:flex; align-items:center; gap:11px; font-weight:800; font-size:20px; letter-spacing:.2px}
  .logo .ic{width:38px;height:38px;border-radius:12px;background:var(--grad);
    display:flex;align-items:center;justify-content:center;font-size:19px;
    box-shadow:0 4px 16px rgba(249,115,22,.35)}
  .hint{color:var(--muted); font-size:12.5px; margin-left:auto; text-align:right; line-height:1.35}

  /* ---------- buttons ---------- */
  button{font:inherit; color:inherit; border:none; background:none; cursor:pointer; touch-action:manipulation}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:10px 18px; border-radius:12px; font-weight:600; font-size:15px;
    background:var(--card2); border:1px solid var(--border); transition:all .15s}
  .btn:active{transform:scale(.97)}
  .btn:hover{border-color:var(--border2); background:rgba(255,255,255,.1)}
  .btn.primary{background:var(--grad); border:none; color:#fff; box-shadow:0 4px 16px rgba(249,115,22,.3)}
  .btn.primary:hover{filter:brightness(1.1); box-shadow:0 6px 22px rgba(249,115,22,.45)}
  .iconbtn{width:36px;height:36px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;
    background:var(--card2); border:1px solid var(--border); font-size:15px; flex:none; transition:all .15s}
  .iconbtn:hover{border-color:var(--border2); background:rgba(255,255,255,.11)}
  .iconbtn:disabled{opacity:.25; cursor:default}
  .iconbtn.danger{color:var(--danger)}

  /* ---------- workout list ---------- */
  .list-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:10px 0 18px}
  .list-head h1{font-size:24px; margin:0; font-weight:800}
  .wgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:14px}
  .wcard{background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; cursor:pointer; transition:all .18s; display:flex; flex-direction:column; gap:9px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); animation:fadeUp .25s ease both}
  .wcard:hover{border-color:rgba(249,115,22,.55); transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .wcard h3{margin:0; font-size:17px; word-break:break-word; font-weight:700}
  .wcard .meta{color:var(--muted); font-size:13px}
  .wcard .note{color:var(--muted); font-size:13px; font-style:italic; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .wcard .actions{display:flex; gap:8px; margin-top:auto; padding-top:8px}
  @keyframes fadeUp{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  .empty{border:1.5px dashed var(--border2); border-radius:var(--radius); padding:44px 20px; text-align:center; color:var(--muted)}
  .empty .big{font-size:44px; margin-bottom:10px}

  /* ---------- editor layout ---------- */
  .editor{display:grid; grid-template-columns:1fr; gap:16px; animation:fadeUp .25s ease both}
  @media(min-width:920px){ .editor{grid-template-columns:1.25fr .75fr; align-items:start} }
  .panel{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px)}
  .ed-head{display:flex; align-items:center; gap:10px; margin-bottom:14px}
  .ed-head .autosave{margin-left:auto; color:var(--muted); font-size:12px; white-space:nowrap}
  input[type=text], textarea{
    width:100%; background:rgba(0,0,0,.28); border:1px solid var(--border); color:var(--text);
    border-radius:11px; padding:10px 13px; font:inherit; outline:none; transition:border-color .15s}
  input[type=text]:focus, textarea:focus{border-color:var(--accent)}
  .name-input{font-size:19px; font-weight:700}
  textarea{resize:vertical; min-height:44px}
  label.fld{display:block; color:var(--muted); font-size:11.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.7px; margin:15px 0 6px}
  .summary{color:var(--muted); font-size:13px; margin:13px 0 9px}

  /* ---------- exercise rows ---------- */
  .exlist{display:flex; flex-direction:column; gap:10px}
  .exrow{background:var(--card2); border:1px solid var(--border); border-radius:14px; padding:11px 13px;
    transition:border-color .15s}
  .exrow.dragging{opacity:.4}
  .exrow.dragover{border-color:var(--accent)}
  .exrow .r1{display:flex; align-items:center; gap:11px}
  .exrow .num{color:var(--muted); font-weight:700; font-size:12.5px; width:18px; flex:none; text-align:center}
  .exrow .handle{cursor:grab; color:var(--muted); font-size:16px; flex:none; padding:2px 3px; touch-action:none}
  .thumb{width:56px; height:56px; border-radius:12px; background:#fff; object-fit:contain; flex:none;
    border:1px solid var(--border2); cursor:zoom-in; transition:transform .15s}
  .thumb:hover{transform:scale(1.05)}
  .thumb-fb{width:56px; height:56px; border-radius:12px; flex:none; display:none; align-items:center;
    justify-content:center; font-size:24px; background:rgba(255,255,255,.06); border:1px solid var(--border)}
  .exrow .nm{font-weight:600; flex:1; min-width:0; font-size:15px}
  .exrow .nm .sub{display:block; font-weight:500; font-size:12px; color:var(--muted); margin-top:1px}
  .exrow .nm .last{display:block; font-weight:500; font-size:11.5px; color:var(--accent2); margin-top:2px}
  .exrow .r2{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:11px; padding-left:29px}
  .stepper{display:flex; align-items:center; background:rgba(0,0,0,.28); border:1px solid var(--border); border-radius:10px; overflow:hidden}
  .stepper button{width:33px; height:36px; font-size:17px; color:var(--text)}
  .stepper button:hover{background:rgba(255,255,255,.08)}
  .stepper .val{min-width:32px; text-align:center; font-weight:700}
  .fldgrp{display:flex; align-items:center; gap:6px}
  .fldgrp .lbl{color:var(--muted); font-size:11.5px; font-weight:600}
  .reps{width:66px; text-align:center; font-weight:700; padding:8px 4px}
  .weight{width:74px; text-align:center; font-weight:700; padding:8px 4px}
  .exnote{flex:1; min-width:130px; font-size:13px; padding:8px 10px}
  .rowbtns{display:flex; gap:6px; flex:none}

  /* ---------- badges ---------- */
  .badge{display:inline-block; font-size:11px; font-weight:700; padding:2.5px 9px; border-radius:99px;
    background:rgba(255,255,255,.05); border:1px solid var(--border); color:var(--muted)}
  .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:1px}

  /* ---------- picker ---------- */
  .picker .search{margin-bottom:10px}
  .chips{display:flex; gap:7px; overflow-x:auto; padding-bottom:8px; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none; padding:7px 14px; border-radius:99px; background:var(--card2); border:1px solid var(--border);
    font-size:13px; font-weight:600; color:var(--muted); white-space:nowrap; transition:all .15s}
  .chip:hover{border-color:var(--border2)}
  .chip.on{background:var(--grad); border-color:transparent; color:#fff; box-shadow:0 2px 10px rgba(249,115,22,.3)}
  .chips.types .chip.on{background:var(--card2); border-color:var(--accent); color:var(--accent2); box-shadow:none}
  .pklist{max-height:56vh; overflow-y:auto; margin-top:6px; display:flex; flex-direction:column; gap:6px; overscroll-behavior:contain}
  .pkgroup{color:var(--muted); font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.7px;
    margin:11px 0 3px; display:flex; align-items:center; gap:6px}
  .pkitem{display:flex; align-items:center; gap:11px; background:var(--card2); border:1px solid var(--border);
    border-radius:12px; padding:8px 11px; cursor:pointer; text-align:left; width:100%; transition:border-color .15s}
  .pkitem:hover{border-color:rgba(249,115,22,.55)}
  .pkitem .pthumb{width:46px; height:46px; border-radius:10px; background:#fff; object-fit:contain; flex:none;
    border:1px solid var(--border2)}
  .pkitem .pthumb-fb{width:46px; height:46px; border-radius:10px; flex:none; display:none; align-items:center;
    justify-content:center; font-size:20px; background:rgba(255,255,255,.06); border:1px solid var(--border)}
  .pkitem .nm{flex:1; min-width:0; font-weight:600; font-size:14px}
  .pkitem .nm .sub{display:block; font-weight:500; font-size:11.5px; color:var(--muted)}
  .pkitem .nm .last{display:block; font-weight:500; font-size:11px; color:var(--accent2)}
  .pkitem .add{flex:none; width:29px; height:29px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    background:var(--grad); color:#fff; font-size:17px; font-weight:700}
  .pkitem.added{opacity:.5; cursor:default}
  .pkitem.added:hover{border-color:var(--border)}
  .pkitem.added .add{background:var(--ok); font-size:14px}
  .pkempty{color:var(--muted); text-align:center; padding:26px 0; font-size:14px}

  /* ---------- mobile bottom sheet ---------- */
  .fab{display:none}
  @media(max-width:919px){
    /* žádná animace/transform na předcích – jinak iOS Safari udělá z .editor
       containing block pro position:fixed a panel se neroztáhne přes obrazovku */
    .editor{animation:none}
    .picker-wrap{position:fixed; inset:0; width:100%; height:100%; height:100dvh; z-index:100; visibility:hidden}
    .picker-wrap.open{visibility:visible}
    .picker-backdrop{position:absolute; inset:0; background:rgba(0,0,0,.6); opacity:0; transition:opacity .2s}
    .picker-wrap.open .picker-backdrop{opacity:1}
    .picker{position:absolute; inset:0; border-radius:0;
      transform:translateY(100%); transition:transform .28s cubic-bezier(.3,1,.4,1); display:flex; flex-direction:column;
      padding-top:calc(10px + env(safe-area-inset-top, 0px));
      padding-left:calc(18px + env(safe-area-inset-left, 0px));
      padding-right:calc(18px + env(safe-area-inset-right, 0px));
      padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px)); background:#171a22;
      backdrop-filter:none; -webkit-backdrop-filter:none; overflow:hidden}
    .picker .sheet-head, .picker .search, .picker .chips{flex:none}
    .picker-wrap.open .picker{transform:translateY(0)}
    .pklist{max-height:none; flex:1 1 0; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch}
    .sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
    .sheet-head h3{margin:0; font-size:16px}
    .sheet-close{width:44px; height:44px; border-radius:14px; font-size:18px}
    .fab{display:flex; position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom));
      z-index:40; box-shadow:0 8px 28px rgba(249,115,22,.5); padding:14px 28px; border-radius:99px; font-size:16px}
    body.sheet-open .fab{display:none}
    body.sheet-open{overflow:hidden}
  }
  @media(min-width:920px){
    .picker-wrap{position:sticky; top:80px}
    .picker-backdrop{display:none}
    .sheet-head h3{margin:0 0 10px; font-size:16px}
    .sheet-close{display:none}
  }

  /* ---------- lightbox ---------- */
  .lightbox{position:fixed; inset:0; z-index:200; background:rgba(5,6,10,.88); display:none;
    align-items:center; justify-content:center; padding:20px; cursor:zoom-out;
    padding-top:calc(20px + env(safe-area-inset-top, 0px)); padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px));
    padding-left:calc(20px + env(safe-area-inset-left, 0px)); padding-right:calc(20px + env(safe-area-inset-right, 0px));
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)}
  .lightbox.open{display:flex}
  .lb-inner{max-width:860px; width:100%; text-align:center; animation:fadeUp .2s ease both}
  .lb-imgs{display:flex; gap:14px; justify-content:center; flex-wrap:wrap}
  .lb-imgs img{background:#fff; border-radius:16px; max-width:min(400px,90vw); width:calc(50% - 7px);
    min-width:260px; object-fit:contain; border:1px solid var(--border2)}
  .lb-cap{margin-top:14px; font-weight:700; font-size:17px}
  .lb-sub{color:var(--muted); font-size:13px; margin-top:3px}

  /* ---------- technika ---------- */
  .techbadge{display:inline-flex; align-items:center; gap:4px; margin-top:4px; padding:2.5px 10px;
    border-radius:99px; font-size:11px; font-weight:700; color:var(--accent2);
    background:rgba(249,115,22,.12); border:1px solid rgba(249,115,22,.4); cursor:pointer; width:max-content}
  .techbadge:hover{background:rgba(249,115,22,.22)}
  .lightbox{overflow-y:auto; align-items:flex-start}
  .lb-inner{position:relative; margin:auto; cursor:default}
  .lb-close{
    position:fixed;
    top:calc(14px + env(safe-area-inset-top, 0px));
    right:calc(14px + env(safe-area-inset-right, 0px));
    z-index:2; background:#1d212b;
    width:44px; height:44px; border-radius:14px; font-size:18px;
    border:1px solid var(--border2);
  }
  .lb-tech{display:grid; grid-template-columns:1fr; gap:12px; margin-top:18px; text-align:left}
  @media(min-width:720px){ .lb-tech{grid-template-columns:1fr 1fr} }
  .lb-card{background:#151821; border:1px solid var(--border2); border-radius:14px; padding:15px 17px}
  .lb-card h4{margin:0 0 9px; font-size:14px; letter-spacing:.3px}
  .lb-card.ok h4{color:var(--ok)}
  .lb-card.warn h4{color:#fbbf24}
  .lb-card ol, .lb-card ul{margin:0; padding-left:19px; font-size:13.5px; line-height:1.5;
    display:flex; flex-direction:column; gap:7px; color:var(--text)}

  .toast{position:fixed; left:50%; transform:translateX(-50%) translateY(20px); bottom:calc(88px + env(safe-area-inset-bottom));
    background:#1d212b; border:1px solid var(--border2); color:var(--text); padding:10px 20px; border-radius:99px;
    font-size:14px; font-weight:600; opacity:0; pointer-events:none; transition:all .2s; z-index:300;
    box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .hidden{display:none !important}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="logo"><span class="ic">🏋️</span> Tréninky</div>
    <div class="hint">Vše se ukládá automaticky<br>do tohoto prohlížeče</div>
  </div>

  <!-- ============ VIEW: SEZNAM ============ -->
  <section id="viewList">
    <div class="list-head">
      <h1>Moje tréninky</h1>
      <button class="btn primary" onclick="novyTrenink()">＋ Nový trénink</button>
    </div>
    <div id="wgrid"></div>
  </section>

  <!-- ============ VIEW: EDITOR ============ -->
  <section id="viewEditor" class="hidden">
    <div class="ed-head">
      <button class="iconbtn" onclick="zpet()" title="Zpět na seznam">←</button>
      <strong>Úprava tréninku</strong>
      <span class="autosave">✓ ukládá se automaticky</span>
    </div>
    <div class="editor">
      <div class="panel">
        <label class="fld" for="wname">Název tréninku</label>
        <input type="text" id="wname" class="name-input" placeholder="např. Ramena A" oninput="zmenNazev(this.value)">
        <label class="fld" for="wnote">Poznámka k tréninku (volitelné)</label>
        <textarea id="wnote" rows="1" placeholder="např. rozcvička 10 min, pauzy 90 s…" oninput="zmenPoznamku(this.value)"></textarea>
        <div class="summary" id="wsummary"></div>
        <div class="exlist" id="exlist"></div>
        <div class="empty hidden" id="exempty">
          <div class="big">💪</div>
          Zatím žádné cviky.<br>Přidej je z databáze cviků<span id="emptyHintMobile"> tlačítkem dole</span>.
        </div>
      </div>

      <div class="picker-wrap" id="pickerWrap">
        <div class="picker-backdrop" onclick="zavriPicker()"></div>
        <div class="panel picker">
          <div class="sheet-head">
            <h3>Databáze cviků <span id="pkCount" style="color:var(--muted);font-weight:500;font-size:13px"></span></h3>
            <button class="iconbtn sheet-close" onclick="zavriPicker()">✕</button>
          </div>
          <input type="text" class="search" id="pkSearch" placeholder="🔍 Hledat cvik…" oninput="renderPicker()">
          <div class="chips" id="chipsPartie"></div>
          <div class="chips types" id="chipsTyp"></div>
          <div class="pklist" id="pklist"></div>
        </div>
      </div>
    </div>
    <button class="btn primary fab" onclick="otevriPicker()">＋ Přidat cvik</button>
  </section>

  <div class="lightbox" id="lightbox" onclick="this.classList.remove('open')">
    <button class="iconbtn lb-close" onclick="document.getElementById('lightbox').classList.remove('open')">✕</button>
    <div class="lb-inner" onclick="event.stopPropagation()">
      <div class="lb-imgs" id="lbImgs"></div>
      <div class="lb-cap" id="lbCap"></div>
      <div class="lb-sub" id="lbSub"></div>
      <div class="lb-tech" id="lbTech"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
"use strict";

/* ================= DATABÁZE CVIKŮ ================= */
const PARTIE = ["ramena","prsa","záda","nohy","biceps","triceps","břicho","předloktí"];
const TYPY   = ["stroj","jednoručky","velká činka","kladka","vlastní váha"];
const SLUG   = {"ramena":"ramena","prsa":"prsa","záda":"zada","nohy":"nohy","biceps":"biceps",
                "triceps":"triceps","břicho":"bricho","předloktí":"predlokti"};
const TYP_IKONA = {"stroj":"⚙️","jednoručky":"🏋️","velká činka":"🏋️","kladka":"🔗","vlastní váha":"🤸"};

const CVIKY = [
  {id:1, n:"Tlaky s velkou činkou ve stoje", p:"ramena", t:"velká činka", img:"Standing_Military_Press"},
  {id:2, n:"Tlaky s jednoručkami v sedě", p:"ramena", t:"jednoručky", img:"Seated_Dumbbell_Press"},
  {id:3, n:"Arnoldovy tlaky", p:"ramena", t:"jednoručky", img:"Arnold_Dumbbell_Press"},
  {id:4, n:"Upažování s jednoručkami", p:"ramena", t:"jednoručky", img:"Side_Lateral_Raise"},
  {id:5, n:"Předpažování s jednoručkami", p:"ramena", t:"jednoručky", img:"Front_Dumbbell_Raise"},
  {id:6, n:"Zapažování v předklonu", p:"ramena", t:"jednoručky", img:"Seated_Bent-Over_Rear_Delt_Raise"},
  {id:7, n:"Tlaky na ramena na stroji", p:"ramena", t:"stroj", img:"Machine_Shoulder_Military_Press"},
  {id:8, n:"Upažování na stroji", p:"ramena", t:"stroj"},

/* obrázky: free-exercise-db (public domain), CDN + fallback */
const IMG_CDN = "https://cdn.jsdelivr.net/gh/yuhonas/free-exercise-db@main/exercises/";
const IMG_RAW = "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/";
function imgUrl(cv, n){ return IMG_CDN + cv.img + "/" + n + ".jpg"; }
function imgHtml(cv, cls, fbCls){
  const fb = `<span class="${fbCls}" style="display:flex">${TYP_IKONA[cv.t]||"💪"}</span>`;
  if(!cv.img) return fb;
  return `<img class="${cls}" loading="lazy" src="${imgUrl(cv,0)}" alt=""
    onclick="event.stopPropagation(); openLightbox(${cv.id})"
    onerror="if(!this.dataset.f){this.dataset.f=1;this.src='${IMG_RAW}${cv.img}/0.jpg'}else{this.style.display='none';this.nextElementSibling.style.display='flex'}">
    <span class="${fbCls}">${TYP_IKONA[cv.t]||"💪"}</span>`;
}

/* ================= STAV + ULOŽIŠTĚ ================= */
const KEY = "posilovna.treninky.v1";
const KEY_MEM = "posilovna.pamet.v1";
let treninky = nacti(KEY, []);
let pamet = nacti(KEY_MEM, {});           // { cvikId: {s, o, v, ts} }
let aktualniId = null;
let fPartie = "vše";
let fTyp = "vše";

function nacti(k, def){
  try{ const d = JSON.parse(localStorage.getItem(k)); return d ?? def; }
  catch(e){ return def; }
}
function uloz(){
  const t = aktualni(); if(t) t.updated = Date.now();
  safeSet(KEY, JSON.stringify(treninky));
}
function ulozPamet(){ safeSet(KEY_MEM, JSON.stringify(pamet)); }
function zapisPamet(c){
  pamet[c.cvikId] = {s:c.serie, o:c.opak, v:c.vaha||"", ts:Date.now()};
  ulozPamet();
}
function pametText(cvikId){
  const m = pamet[cvikId]; if(!m) return "";
  const parts = [];
  if(m.s && m.o) parts.push(`${m.s}×${m.o}`);
  if(m.v) parts.push(`${m.v} kg`);
  if(!parts.length) return "";
  return "🕘 minule " + parts.join(" · ");
}
function safeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ toast("⚠️ Nepodařilo se uložit — úložiště je plné nebo blokované"); } }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function aktualni(){ return treninky.find(t=>t.id===aktualniId); }
function esc(s){ return String(s??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

/* ================= SEZNAM TRÉNINKŮ ================= */
function renderSeznam(){
  const grid = document.getElementById("wgrid");
  if(!treninky.length){
    grid.className = "";
    grid.innerHTML = `<div class="empty"><div class="big">🏋️</div>
      Zatím nemáš žádný trénink.<br>Začni tlačítkem <strong>＋ Nový trénink</strong>.</div>`;
    return;
  }
  const seraz = [...treninky].sort((a,b)=>(b.updated||0)-(a.updated||0));
  grid.className = "wgrid";
  grid.innerHTML = seraz.map((t,idx)=>{
    const serie = t.cviky.reduce((s,c)=>s+(c.serie||0),0);
    const datum = t.updated ? new Date(t.updated).toLocaleDateString("cs-CZ") : "";
    const partie = [...new Set(t.cviky.map(c=>CVIK_MAP[c.cvikId]?.p).filter(Boolean))];
    return `<div class="wcard" style="animation-delay:${Math.min(idx*40,300)}ms" onclick="otevri('${t.id}')">
      <h3>${esc(t.nazev)||"Bez názvu"}</h3>
      <div class="meta">${t.cviky.length} ${sklonCvik(t.cviky.length)} · ${serie} ${sklonSerie(serie)} · ${datum}</div>
      <div>${partie.map(p=>`<span class="badge"><span class="dot" style="background:var(--c-${SLUG[p]})"></span>${p}</span>`).join(" ")}</div>
      ${t.pozn ? `<div class="note">${esc(t.pozn)}</div>` : ""}
      <div class="actions" onclick="event.stopPropagation()">
        <button class="btn" style="flex:1" onclick="otevri('${t.id}')">Otevřít</button>
        <button class="iconbtn" title="Duplikovat" onclick="duplikuj('${t.id}')">⧉</button>
        <button class="iconbtn danger" title="Smazat" onclick="smaz('${t.id}')">🗑</button>
      </div>
    </div>`;
  }).join("");
}
function sklonCvik(n){ return n===1?"cvik":(n>=2&&n<=4?"cviky":"cviků"); }
function sklonSerie(n){ return n===1?"série":(n>=2&&n<=4?"série":"sérií"); }

function novyTrenink(){
  const t = {id:uid(), nazev:"", pozn:"", cviky:[], updated:Date.now()};
  treninky.push(t); uloz();
  otevri(t.id);
  setTimeout(()=>document.getElementById("wname").focus(), 50);
}
function duplikuj(id){
  const src = treninky.find(t=>t.id===id); if(!src) return;
  const kopie = JSON.parse(JSON.stringify(src));
  kopie.id = uid();
  kopie.nazev = (src.nazev||"Bez názvu") + " (kopie)";
  kopie.updated = Date.now();
  treninky.push(kopie); uloz(); renderSeznam();
  toast("Trénink zduplikován");
}
function smaz(id){
  const t = treninky.find(x=>x.id===id);
  if(!confirm(`Smazat trénink „${t?.nazev||"Bez názvu"}“?`)) return;
  treninky = treninky.filter(x=>x.id!==id);
  safeSet(KEY, JSON.stringify(treninky));
  renderSeznam();
  toast("Trénink smazán");
}

/* ================= EDITOR ================= */
function zmenNazev(v){ const t=aktualni(); if(t){ t.nazev=v; uloz(); } }
function zmenPoznamku(v){ const t=aktualni(); if(t){ t.pozn=v; uloz(); } }

function renderCviky(){
  const t = aktualni(); if(!t) return;

  const empty = document.getElementById("exempty");

      <div class="r1">
        <span class="handle" draggable="true" ondragstart="dragStart(event,${i})" ondragend="dragEnd(event)" title="Přetáhnout">⠿</span>
        <span class="num">${i+1}.</span>
        ${imgHtml(cv,"thumb","thumb-fb")}
        <span class="nm">${esc(cv.n)}
          <span class="sub"><span class="dot" style="background:var(--c-${SLUG[cv.p]||"zada"})"></span>${esc(cv.p)} · ${esc(cv.t)}</span>
          ${mem?`<span class="last">${mem}</span>`:""}
          ${TECHNIKA[c.cvikId]?`<button class="techbadge" onclick="openLightbox(${c.cvikId})">ⓘ technika</button>`:""}
        </span>
        <span class="rowbtns">
          <button class="iconbtn" ${i===0?"disabled":""} onclick="posun(${i},-1)" title="Nahoru">↑</button>
          <button class="iconbtn" ${i===t.cviky.length-1?"disabled":""} onclick="posun(${i},1)" title="Dolů">↓</button>
          <button class="iconbtn danger" onclick="odeberCvik(${i})" title="Odebrat">✕</button>
        </span>
      </div>
      <div class="r2">
        <span class="fldgrp"><span class="lbl">Série</span>
          <span class="stepper">
            <button onclick="zmenSerie(${i},-1)">−</button>
            <span class="val">${c.serie}</span>
            <button onclick="zmenSerie(${i},1)">＋</button>
          </span>
        </span>
        <span class="fldgrp"><span class="lbl">Opak.</span>
          <input type="text" class="reps" value="${esc(c.opak)}" placeholder="10"
            oninput="zmenOpak(${i},this.value)">
        </span>
        <span class="fldgrp"><span class="lbl">Váha (kg)</span>
          <input type="text" class="weight" value="${esc(c.vaha||"")}" placeholder="—"
            oninput="zmenVahu(${i},this.value)">
        </span>
        <input type="text" class="exnote" value="${esc(c.pozn||"")}" placeholder="Poznámka (tempo, úchop…)"
          oninput="zmenCvikPozn(${i},this.value)">
      </div>
    </div>`;
  }).join("");
}

function pridejCvik(cvikId){
  const t = aktualni(); if(!t) return;
  if(t.cviky.some(c=>c.cvikId===cvikId)) return;
  const m = pamet[cvikId];
  t.cviky.push({cvikId, serie:m?.s||3, opak:m?.o||"10", vaha:m?.v||"", pozn:""});
  uloz(); renderCviky(); renderPicker();
  toast("Cvik přidán" + (m ? " (předvyplněno z minula)" : ""));
}
function odeberCvik(i){
  const t = aktualni(); if(!t || !t.cviky[i]) return;
  const cv = CVIK_MAP[t.cviky[i].cvikId];
  if(!confirm(`Odebrat cvik „${cv?.n || "cvik"}“ z tréninku?`)) return;
  t.cviky.splice(i,1);
  uloz(); renderCviky(); renderPicker();
}
function posun(i,dir){
  const t = aktualni(); const j = i+dir;
  if(j<0 || j>=t.cviky.length) return;
  [t.cviky[i], t.cviky[j]] = [t.cviky[j], t.cviky[i]];
  uloz(); renderCviky();
}
function zmenSerie(i,d){
  const t = aktualni();
  t.cviky[i].serie = Math.min(12, Math.max(1, (t.cviky[i].serie||1)+d));
  zapisPamet(t.cviky[i]);
  uloz(); renderCviky();
}
function zmenOpak(i,v){ const t=aktualni(); t.cviky[i].opak=v; zapisPamet(t.cviky[i]); uloz(); }
function zmenVahu(i,v){ const t=aktualni(); t.cviky[i].vaha=v; zapisPamet(t.cviky[i]); uloz(); }
function zmenCvikPozn(i,v){ const t=aktualni(); t.cviky[i].pozn=v; uloz(); }

/* --------- drag & drop --------- */
let dragIdx = null;
function dragStart(e,i){
  dragIdx = i;
  e.dataTransfer.effectAllowed = "move";
  const row = e.target.closest(".exrow");
  e.dataTransfer.setDragImage(row, 20, 20);
  setTimeout(()=>row.classList.add("dragging"), 0);
}
function dragOver(e,i){ e.preventDefault(); e.currentTarget.classList.add("dragover"); }
function dropRow(e,i){
  e.preventDefault();
  if(dragIdx===null || dragIdx===i) { renderCviky(); return; }
  const t = aktualni();
  const [mv] = t.cviky.splice(dragIdx,1);
  t.cviky.splice(i,0,mv);
  dragIdx = null;
  uloz(); renderCviky();
}
function dragEnd(){ dragIdx=null; document.querySelectorAll(".exrow").forEach(r=>r.classList.remove("dragging","dragover")); }

/* ================= PICKER ================= */
function renderChips(){
  const cp = document.getElementById("chipsPartie");
  cp.innerHTML = ["vše",...PARTIE].map(p=>
    `<button class="chip ${fPartie===p?"on":""}" onclick="setPartie('${p}')">${p==="vše"?"Vše":p.charAt(0).toUpperCase()+p.slice(1)}</button>`
  ).join("");
  const ct = document.getElementById("chipsTyp");
  ct.innerHTML = ["vše",...TYPY].map(t=>
    `<button class="chip ${fTyp===t?"on":""}" onclick="setTyp('${t}')">${t==="vše"?"Všechny typy":t}</button>`
  ).join("");
}
function setPartie(p){ fPartie=p; renderChips(); renderPicker(); }
function setTyp(t){ fTyp=t; renderChips(); renderPicker(); }

function renderPicker(){
  const q = norm(document.getElementById("pkSearch").value);
  const t = aktualni();
  const vBusy = new Set(t ? t.cviky.map(c=>c.cvikId) : []);
  let data = CVIKY.filter(c =>
    (fPartie==="vše" || c.p===fPartie) &&
    (fTyp==="vše" || c.t===fTyp) &&
    (!q || norm(c.n).includes(q) || norm(c.p).includes(q) || matchEn(c,q))
  );
  document.getElementById("pkCount").textContent = `(${data.length})`;
  const el = document.getElementById("pklist");
  if(!data.length){ el.innerHTML = `<div class="pkempty">Žádný cvik neodpovídá filtru.</div>`; return; }
  let html = "";
  for(const p of PARTIE){
    const g = data.filter(c=>c.p===p);
    if(!g.length) continue;
    html += `<div class="pkgroup"><span class="dot" style="background:var(--c-${SLUG[p]})"></span>${p}</div>`;
    html += g.map(c=>{
      const added = vBusy.has(c.id);
      const mem = pametText(c.id);
      return `<button class="pkitem ${added?"added":""}" ${added?"":`onclick="pridejCvik(${c.id})"`}>
        ${imgHtml(c,"pthumb","pthumb-fb")}
        <span class="nm">${esc(c.n)}<span class="sub">${esc(c.t)}</span>${mem?`<span class="last">${mem}</span>`:""}</span>
        <span class="add">${added?"✓":"＋"}</span>
      </button>`;
    }).join("");
  }
  el.innerHTML = html;
}
function norm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }

/* anglické hledání: img slug = anglický název cviku; + pár aliasů */
const EN_ALIAS = {
  1:"overhead press ohp", 100:"overhead press", 101:"behind neck press",
  8:"machine lateral raise", 38:"rdl", 168:"rdl",
  16:"pec deck fly", 106:"reverse pec deck", 25:"lat pulldown", 148:"lat pulldown", 149:"lat pulldown", 150:"lat pulldown",
  59:"dips", 20:"dips", 64:"plank", 223:"side plank"
};
function matchEn(c,q){
  const en = norm(((c.img||"").replace(/[_-]/g," ") + " " + (EN_ALIAS[c.id]||"")));
  if(en.includes(q)) return true;
  const flat = en.replace(/[\s]/g,""), qflat = q.replace(/[\s-]/g,"");
  return qflat.length>2 && flat.includes(qflat);
}

/* --------- mobilní bottom sheet --------- */
function jeMobil(){ return window.matchMedia("(max-width:919px)").matches; }
function otevriPicker(){
  const w = document.getElementById("pickerWrap");
  /* na mobilu přesuneme panel přímo pod <body> – tím je imunní vůči tomu,
     že by některý z předků vytvořil containing block pro position:fixed */
  if(jeMobil() && w.parentNode !== document.body){
    document.body.appendChild(w);
    void w.offsetWidth;
  }
  w.classList.add("open");
  document.body.classList.add("sheet-open");
}
function zavriPicker(){
  const w = document.getElementById("pickerWrap");
  w.classList.remove("open");
  document.body.classList.remove("sheet-open");
  const ed = document.querySelector(".editor");
  if(ed && w.parentNode !== ed) ed.appendChild(w);
}

/* ================= LIGHTBOX ================= */
function openLightbox(cvikId){
  const cv = CVIK_MAP[cvikId]; if(!cv) return;
  document.getElementById("lbImgs").innerHTML = cv.img ?
    `<img src="${imgUrl(cv,0)}" alt="" onerror="this.style.display='none'">
     <img src="${imgUrl(cv,1)}" alt="" onerror="this.style.display='none'">` : "";
  document.getElementById("lbCap").textContent = cv.n;
  document.getElementById("lbSub").textContent = cv.p + " · " + cv.t;
  const th = TECHNIKA[cvikId];
  document.getElementById("lbTech").innerHTML = !th ? "" : `
    <div class="lb-card ok"><h4>✅ Správný postup</h4>
      <ol>${th.postup.map(x=>`<li>${x}</li>`).join("")}</ol></div>
    <div class="lb-card warn"><h4>⚠️ Časté chyby</h4>
      <ul>${th.chyby.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  document.getElementById("lightbox").classList.add("open");
}
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){
    document.getElementById("lightbox").classList.remove("open");
    zavriPicker();
  }
});

/* ================= TOAST ================= */
let toastTimer = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 1800);
}

/* ================= START ================= */
renderSeznam();
</script>
</body>
</html>
